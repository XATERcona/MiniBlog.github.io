<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-блог</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="VebNames">LUMI.blog</div>
        <div class="find">
            <input type="text" id="findtext" placeholder="Заголовок или текст">
            <button id="find">Найти</button>
        </div>
    </header>
    <main>
        <div class ="error"></div>


        <div class="box">

        <h1>Написать пост</h1>

        <label for="userName">Имя</label>
        <input type="text"  id="userName" placeholder="Ваше имя">

        <label for="heading">Заголовок поста</label>
        <input type="text"  id="heading" placeholder="Введите заголовок">

        <label for="mainText">Основной текст</label>
        <textarea id="mainText" placeholder="Введите текст"></textarea>
        <div class="format">
        <button id="kurs">Курсив</button>
        <button id="big">Жирный</button>
        <button id="abz">Абзац</button>
        </div>
        
        <button id="create">Cоздать</button>
        </div>

        <h1>Лента постов</h1>
        <div id="list"></div>
    </main>
</body>
</html>
